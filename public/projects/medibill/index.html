<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1b2a"><meta name="description" content="MediBill pharmacy billing, inventory, purchase and reporting workspace."><link rel="manifest" href="./manifest.json"><title>MediBill — Pharmacy Workspace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--navy:#102437;--navy2:#17354a;--teal:#16b8a6;--teal2:#dff8f3;--bg:#f3f7f8;--ink:#142b3d;--muted:#758896;--line:#e3ebee;--white:#fff;--red:#d85a62;--amber:#c18a32;--shadow:0 12px 35px #18384b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:linear-gradient(180deg,#102437,#122f43);color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:28px}.logo{display:flex;gap:11px;align-items:center;padding:0 10px}.logo-mark{height:38px;width:38px;border-radius:12px;background:linear-gradient(145deg,#24c9b3,#0d8d88);display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 8px 20px #0bb9a533}.logo b{font:800 20px Manrope;letter-spacing:-.8px}.logo small{display:block;color:#9db4c0;font-size:10px;letter-spacing:1.4px;margin-top:1px}.nav-label{font-size:10px;color:#829aa8;letter-spacing:1.6px;padding:0 12px;margin:4px 0 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b7c8d1;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:600;transition:.2s}.nav button:hover,.nav button.active{background:#ffffff15;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--teal)}.nav .ico{width:20px;text-align:center;font-size:17px}.side-foot{margin-top:auto;border-top:1px solid #ffffff18;padding:16px 10px;color:#a5bac5;font-size:11px;line-height:1.6}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{font:700 17px Manrope}.top-right{display:flex;align-items:center;gap:12px}.pill{background:#e6f8f4;color:#118e80;padding:7px 11px;border-radius:99px;font-size:11px;font-weight:700}.avatar{height:35px;width:35px;border-radius:50%;background:#dceef0;color:#176c70;display:grid;place-items:center;font-weight:800}.content{padding:28px 32px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:23px}.page-head h1{font:800 25px Manrope;margin:0 0 5px;letter-spacing:-.7px}.page-head p{margin:0;color:var(--muted)}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.primary{background:var(--teal);color:#fff;box-shadow:0 6px 15px #16b8a629}.primary:hover{background:#109f91}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:var(--red)}.small{padding:7px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:18px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}.metric-icon{height:33px;width:33px;border-radius:10px;background:#e5f8f4;display:grid;place-items:center;color:#139f91;font-size:17px}.metric strong{display:block;font:800 25px Manrope;margin:12px 0 4px}.metric small{color:var(--muted);font-size:11px}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.panel{padding:19px;margin-bottom:16px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.panel-head h3{font:700 15px Manrope;margin:0}.muted{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;color:#81919c;font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #edf1f2;font-size:12px}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:4px 8px;border-radius:30px;font-size:10px;font-weight:700;background:#e9f8f3;color:#168a79}.tag.warn{background:#fff5e5;color:#b17a20}.tag.bad{background:#fff0f0;color:#c34d57}.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:190px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#65cfc1!important;box-shadow:0 0 0 3px #16b8a615}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:700;color:#627684}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;color:var(--ink)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form-grid .wide{grid-column:1/-1}.empty{text-align:center;padding:32px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.bar{height:8px;border-radius:20px;background:#edf3f3;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#16b8a6,#69d8c9);border-radius:20px}.bill-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.bill-total{font:800 26px Manrope}.product-row{display:grid;grid-template-columns:2fr .7fr .8fr 35px;gap:7px;align-items:end;margin-bottom:9px}.product-row input,.product-row select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;min-width:0}.qr{width:150px;height:150px;object-fit:contain;border:1px solid var(--line);border-radius:10px;padding:7px;background:white}.overlay{position:fixed;inset:0;background:#0b1d2c88;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 25px 80px #081b2c44}.modal h2{font:800 20px Manrope;margin:0 0 18px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#fff7e8;color:#8b6529;font-size:11px;line-height:1.55;margin-bottom:15px}.notice.info{background:#eaf7f8;color:#356b75}.hide{display:none!important}.chart{height:175px;display:flex;align-items:end;gap:10px;padding:12px 4px 0}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.chart-col i{width:min(30px,70%);min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#42cbb8,#139f91)}.chart-col small{font-size:9px;color:var(--muted)}.chart-col b{font-size:9px;color:#647987}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.report-box{padding:15px;border:1px solid var(--line);border-radius:10px}.report-box small{color:var(--muted)}.report-box strong{display:block;font:700 20px Manrope;margin-top:8px}.bottom-nav{display:none}
@media(max-width:1000px){.app{grid-template-columns:205px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:22px}.topbar{padding:0 22px}.grid2,.bill-layout{grid-template-columns:1fr}}
@media(max-width:680px){.app{display:block;padding-bottom:68px}.sidebar{display:none}.topbar{height:60px;padding:0 16px}.content{padding:18px 14px}.page-head h1{font-size:21px}.page-head{align-items:center}.cards{gap:9px}.metric{padding:13px}.metric strong{font-size:20px}.metric-top{font-size:10px}.metric-icon{height:28px;width:28px}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#102437;z-index:10;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px #10243722}.bottom-nav button{border:0;background:none;color:#a9c0cb;font-size:9px;display:grid;gap:3px;justify-items:center}.bottom-nav button.active{color:#45d7c4}.bottom-nav span{font-size:18px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.product-row{grid-template-columns:1.5fr .6fr .7fr 30px}.search{min-width:0;flex:1}.report-grid{grid-template-columns:repeat(2,1fr)}.toolbar{width:100%}.page-head .btn{padding:9px;font-size:11px}}
@media print{.sidebar,.topbar,.bottom-nav,.page-head,.no-print{display:none!important}.app{display:block}.content{padding:0}.panel{box-shadow:none;border:0}.invoice-print{display:block!important}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="logo"><div class="logo-mark">✚</div><div><b>MediBill</b><small>PHARMACY SUITE</small></div></div><div><div class="nav-label">WORKSPACE</div><nav class="nav" id="sideNav"></nav></div><div class="side-foot">MediBill Pharmacy Workspace<br><span style="color:#6f909e">Offline-first • Local data storage</span></div></aside>
<div class="main"><header class="topbar"><div class="crumb" id="crumb">Overview</div><div class="top-right"><span class="pill">● Local workspace</span><div class="avatar">MB</div></div></header><main class="content" id="view"></main></div></div><nav class="bottom-nav" id="bottomNav"></nav><div class="overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10);
const navItems=[['dashboard','▦','Overview'],['billing','▤','Billing'],['inventory','▣','Inventory'],['history','◷','Bill history'],['insights','◈','Insights'],['purchase','⇩','Purchase'],['gst','▤','GST report'],['sales','▥','Sales report'],['settings','⚙','Settings']];
let state=load();let page='dashboard',cart=[],billCustomer='',billDiscount=0;
function seed(){return {settings:{store:'MediBill Pharmacy',address:'',phone:'',gstin:'',upi:'medibill@upi',currency:'INR',gstDefault:12},products:[{id:1,name:'Paracetamol 500 mg',sku:'MED001',batch:'PCM2401',expiry:'2027-08-31',qty:120,unit:'Strip',cost:18,sell:25,gst:5,supplier:'Health Distributors'},{id:2,name:'Cetirizine 10 mg',sku:'MED002',batch:'CTZ2402',expiry:'2027-05-31',qty:48,unit:'Strip',cost:22,sell:32,gst:5,supplier:'Health Distributors'},{id:3,name:'Vitamin C 500 mg',sku:'MED003',batch:'VTC2403',expiry:'2027-12-31',qty:30,unit:'Bottle',cost:65,sell:95,gst:12,supplier:'Wellness Supply'},{id:4,name:'ORS Sachet',sku:'MED004',batch:'ORS2404',expiry:'2027-04-30',qty:8,unit:'Piece',cost:12,sell:20,gst:5,supplier:'Care Pharma'}],bills:[],purchases:[],nextId:5};}
function load(){try{return JSON.parse(localStorage.getItem('medibill-v1'))||seed()}catch(e){return seed()}}function save(){localStorage.setItem('medibill-v1',JSON.stringify(state))}
function nav(){let html=navItems.map(([id,ic,n])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'"><span class="ico">'+ic+'</span>'+n+'</button>').join('');$('#sideNav').innerHTML=html;$('#bottomNav').innerHTML=navItems.slice(0,5).map(([id,ic,n])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'"><span>'+ic+'</span>'+n+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;nav();$('#crumb').textContent=navItems.find(x=>x[0]===p)?.[2]||p;render()}
function head(title,desc,button=''){return '<div class="page-head"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+button+'</div>'}
function metric(label,val,sub,ic){return '<div class="card metric"><div class="metric-top"><span>'+label+'</span><span class="metric-icon">'+ic+'</span></div><strong>'+val+'</strong><small>'+sub+'</small></div>'}
function recentRows(items){return items.slice(0,6).map(b=>'<tr><td><b>'+esc(b.no)+'</b></td><td>'+esc(b.customer||'Walk-in')+'</td><td>'+dateFmt(b.date)+'</td><td>'+money(b.total)+'</td><td><span class="tag">'+esc(b.payment||'—')+'</span></td></tr>').join('')||'<tr><td colspan="5" class="empty">No bills recorded yet.</td></tr>'}
function dateFmt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){let sales=state.bills.filter(b=>b.date===today()).reduce((a,b)=>a+b.total,0),month=state.bills.filter(b=>b.date?.slice(0,7)===today().slice(0,7)).reduce((a,b)=>a+b.total,0),low=state.products.filter(p=>p.qty<=10).length,stock=state.products.reduce((a,p)=>a+p.qty*p.cost,0);return head('Good day 👋','Here’s what’s happening at your pharmacy today.','<button class="btn primary" onclick="go(\'billing\')">＋ New bill</button>')+'<div class="cards">'+metric("Today’s sales",money(sales),state.bills.filter(b=>b.date===today()).length+' invoices today','₹')+metric('This month',money(month),'Sales recorded this month','↗')+metric('Products',state.products.length,'Active inventory items','▣')+metric('Low stock',low,low?'Needs attention':'Stock levels look good','!')+'</div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Recent bills</h3><button class="btn secondary small" onclick="go(\'history\')">View all →</button></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Amount</th><th>Payment</th></tr></thead><tbody>'+recentRows([...state.bills].reverse())+'</tbody></table></div></section><section class="panel"><div class="panel-head"><h3>Inventory watch</h3><button class="btn secondary small" onclick="go(\'inventory\')">Manage →</button></div>'+state.products.filter(p=>p.qty<=15).slice(0,5).map(p=>'<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><b>'+esc(p.name)+'</b><span class="'+(p.qty<=10?'tag bad':'tag warn')+'">'+p.qty+' left</span></div><div class="bar"><i style="width:'+Math.min(100,p.qty/30*100)+'%;background:'+(p.qty<=10?'#d85a62':'')+'"></i></div></div>').join('')||'<div class="empty">All products have healthy stock.</div>'+'</section></div><div class="notice info">Demo workspace: sample medicines are preloaded. Replace them with your actual catalog before using MediBill for live transactions.</div>'}
function billing(){return head('Create bill','Search products, add quantities and collect payment.')+'<div class="bill-layout"><section class="panel"><div class="panel-head"><h3>Invoice details</h3><span class="tag">New invoice</span></div><div class="form-grid"><div class="field"><label>Customer name</label><input id="customer" placeholder="Walk-in customer"></div><div class="field"><label>Mobile number (optional)</label><input id="mobile" placeholder="10-digit mobile" inputmode="numeric"></div></div><div class="rule"></div><div class="field"><label>Add medicine / product</label><select id="productSelect"><option value="">Choose from inventory…</option>'+state.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.batch)+' · '+p.qty+' available · '+money(p.sell)+'</option>').join('')+'</select></div><div class="toolbar" style="margin:10px 0"><button class="btn secondary small" onclick="addCart()">＋ Add item</button><span class="muted" style="font-size:11px">Batch and expiry are tracked from inventory.</span></div><div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th><th></th></tr></thead><tbody id="cartRows">'+cartRows()+'</tbody></table></div></section><section class="panel"><div class="panel-head"><h3>Payment summary</h3></div><div class="field"><label>Discount (₹)</label><input id="discount" type="number" min="0" value="'+billDiscount+'" oninput="billDiscount=+this.value||0;updateTotals()"></div><div id="billTotals" style="margin:18px 0">'+totalsHtml()+'</div><div class="field"><label>Payment method</label><select id="payMethod"><option>UPI</option><option>Cash</option><option>Card</option><option>Split / Other</option></select></div><div class="field" style="margin-top:12px"><label>UPI QR option</label><select id="qrMode" onchange="updateTotals()"><option value="dynamic">Dynamic QR · exact invoice amount</option><option value="static">Shop UPI QR</option></select></div><div id="qrArea" style="text-align:center;margin:14px 0"></div><button class="btn primary" style="width:100%;justify-content:center" onclick="completeBill()">Save bill & record payment</button><p class="muted" style="font-size:10px;line-height:1.5">UPI QR opens a payment intent in a compatible UPI app. Payment is recorded when staff confirms it; automatic bank settlement verification requires a payment gateway integration.</p></section></div>'}
function cartRows(){return cart.map((c,i)=>'<tr><td><b>'+esc(c.name)+'</b><br><small class="muted">'+esc(c.batch)+'</small></td><td><input aria-label="Quantity" type="number" min="1" max="'+c.available+'" value="'+c.qty+'" style="width:55px;padding:6px;border:1px solid var(--line);border-radius:6px" onchange="cart['+i+'].qty=Math.max(1,Math.min('+c.available+',+this.value||1));refreshCart()"></td><td>'+money(c.price)+'</td><td>'+c.gst+'%</td><td>'+money(c.qty*c.price)+'</td><td><button class="btn danger small" onclick="cart.splice('+i+',1);refreshCart()">×</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">Add medicines to start a bill.</td></tr>'}
function calc(){let subtotal=cart.reduce((a,c)=>a+c.qty*c.price,0),tax=cart.reduce((a,c)=>a+c.qty*c.price*c.gst/100,0);let discount=Math.min(billDiscount,subtotal+tax);return {subtotal,tax,discount,total:Math.max(0,subtotal+tax-discount)}}
function totalsHtml(){let t=calc();return '<div style="display:grid;gap:12px;font-size:12px"><div style="display:flex;justify-content:space-between"><span class="muted">Subtotal</span><b>'+money(t.subtotal)+'</b></div><div style="display:flex;justify-content:space-between"><span class="muted">GST</span><b>'+money(t.tax)+'</b></div><div style="display:flex;justify-content:space-between"><span class="muted">Discount</span><b>− '+money(t.discount)+'</b></div><div class="rule" style="margin:4px 0"></div><div style="display:flex;justify-content:space-between;align-items:center"><b>Grand total</b><span class="bill-total">'+money(t.total)+'</span></div></div>'}
function refreshCart(){if($('#cartRows'))$('#cartRows').innerHTML=cartRows();updateTotals()}function updateTotals(){if($('#billTotals'))$('#billTotals').innerHTML=totalsHtml();renderQR()}
function addCart(){let id=+$('#productSelect').value,p=state.products.find(x=>x.id===id);if(!p)return alert('Choose a product first.');let c=cart.find(x=>x.id===id);if(c){if(c.qty>=p.qty)return alert('No more stock available.');c.qty++}else cart.push({id:p.id,name:p.name,batch:p.batch,qty:1,available:p.qty,price:p.sell,gst:p.gst});$('#productSelect').value='';refreshCart()}
function upiUri(amount){let s=state.settings;return 'upi://pay?pa='+encodeURIComponent(s.upi||'')+'&pn='+encodeURIComponent(s.store||'MediBill Pharmacy')+'&am='+Number(amount||0).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('MediBill pharmacy invoice')}
function renderQR(){let el=$('#qrArea');if(!el)return;let mode=$('#qrMode')?.value||'dynamic',amount=mode==='static'?0:calc().total;if(!state.settings.upi){el.innerHTML='<small class="muted">Set your UPI ID in Settings to generate a QR.</small>';return}let uri=mode==='static'?'upi://pay?pa='+encodeURIComponent(state.settings.upi)+'&pn='+encodeURIComponent(state.settings.store)+'&cu=INR':upiUri(amount);el.innerHTML='<img class="qr" alt="UPI QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(uri)+'"><div style="font-size:11px;font-weight:700;margin-top:7px">'+(mode==='static'?'Shop UPI QR':'Pay '+money(amount))+'</div><a style="font-size:10px;color:#119a8b" href="'+uri+'">Open UPI app</a>'}
function completeBill(){if(!cart.length)return alert('Add at least one medicine.');for(let c of cart){let p=state.products.find(x=>x.id===c.id);if(!p||p.qty<c.qty)return alert('Stock changed for '+c.name+'. Please refresh the bill.')}let t=calc(),method=$('#payMethod').value,b={id:Date.now(),no:'MB-'+today().replaceAll('-','')+'-'+String(state.nextId++).padStart(4,'0'),date:today(),customer:$('#customer').value.trim()||'Walk-in',mobile:$('#mobile').value.trim(),items:cart.map(c=>({...c})),subtotal:t.subtotal,tax:t.tax,discount:t.discount,total:t.total,payment:method,status:'Paid'};b.items.forEach(c=>{let p=state.products.find(x=>x.id===c.id);p.qty-=c.qty});state.bills.push(b);save();cart=[];billDiscount=0;alert('Invoice '+b.no+' saved.');showInvoice(b.id)}
function showInvoice(id){let b=state.bills.find(x=>x.id===id);if(!b)return;let upi=upiUri(b.total);let qr='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(upi);$('#modal').innerHTML='<h2>Invoice '+esc(b.no)+'</h2><div id="printable"><div style="text-align:center;padding:10px"><h2>'+esc(state.settings.store)+'</h2><p>'+esc(state.settings.address)+'<br>'+esc(state.settings.phone)+' · GSTIN: '+esc(state.settings.gstin||'Not configured')+'</p><hr><b>TAX INVOICE</b></div><p>Invoice: '+esc(b.no)+'<br>Date: '+dateFmt(b.date)+'<br>Customer: '+esc(b.customer)+' · '+esc(b.mobile)+'</p><table><thead><tr><th>Item</th><th>Batch</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr></thead><tbody>'+b.items.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.batch)+'</td><td>'+c.qty+'</td><td>'+money(c.price)+'</td><td>'+c.gst+'%</td><td>'+money(c.qty*c.price)+'</td></tr>').join('')+'</tbody></table><div style="text-align:right;line-height:2;margin-top:15px">Subtotal: '+money(b.subtotal)+'<br>GST: '+money(b.tax)+'<br>Discount: '+money(b.discount)+'<br><b>Grand total: '+money(b.total)+'</b><br>Payment: '+esc(b.payment)+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px"><small>Scan to pay (UPI)</small><img src="'+qr+'" width="105" height="105"></div><p style="text-align:center;font-size:10px">Thank you. Get well soon.</p></div><div class="modal-foot no-print"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="printInvoice()">Print / Save PDF</button></div>';openModal()}
function printInvoice(){let content=$('#printable').innerHTML,w=window.open('','_blank');w.document.write('<html><head><title>MediBill Invoice</title><style>body{font:13px Arial;padding:25px;color:#172d3a}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}p{line-height:1.6}</style></head><body>'+content+'</body></html>');w.document.close();w.focus();w.print()}
function inventory(){return head('Inventory','Manage medicine catalog, batches, expiry and stock.','<button class="btn primary" onclick="productModal()">＋ Add product</button>')+'<div class="cards">'+metric('Products',state.products.length,'Catalog items','▣')+metric('Units in stock',state.products.reduce((a,p)=>a+p.qty,0),'Across all batches','◫')+metric('Low stock',state.products.filter(p=>p.qty<=10).length,'10 units or fewer','!')+metric('Stock value',money(state.products.reduce((a,p)=>a+p.qty*p.cost,0)),'At purchase cost','₹')+'</div><section class="panel"><div class="panel-head"><h3>Medicine catalog</h3><input class="search" id="invSearch" placeholder="Search name, SKU or batch…" oninput="filterTable('invSearch','invTable')"></div><div class="table-wrap"><table id="invTable"><thead><tr><th>Medicine</th><th>SKU</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Cost</th><th>Price</th><th>GST</th><th></th></tr></thead><tbody>'+state.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku)+'</td><td>'+esc(p.batch)+'</td><td>'+dateFmt(p.expiry)+'</td><td><span class="'+(p.qty<=10?'tag bad':p.qty<=20?'tag warn':'tag')+'">'+p.qty+' '+esc(p.unit)+'</span></td><td>'+money(p.cost)+'</td><td>'+money(p.sell)+'</td><td>'+p.gst+'%</td><td><button class="btn secondary small" onclick="productModal('+p.id+')">Edit</button></td></tr>').join('')||'<tr><td colspan="9" class="empty">No products. Add your first medicine.</td></tr>'+'</tbody></table></div></section>'}
function productModal(id){let p=state.products.find(x=>x.id===id)||{name:'',sku:'',batch:'',expiry:'',qty:0,unit:'Strip',cost:0,sell:0,gst:5,supplier:''};$('#modal').innerHTML='<h2>'+(id?'Edit product':'Add inventory product')+'</h2><form id="productForm" class="form-grid"><div class="field wide"><label>Medicine / product name *</label><input name="name" required value="'+esc(p.name)+'"></div><div class="field"><label>SKU / barcode</label><input name="sku" value="'+esc(p.sku)+'"></div><div class="field"><label>Batch number *</label><input name="batch" required value="'+esc(p.batch)+'"></div><div class="field"><label>Expiry date *</label><input name="expiry" type="date" required value="'+esc(p.expiry)+'"></div><div class="field"><label>Quantity *</label><input name="qty" type="number" min="0" required value="'+p.qty+'"></div><div class="field"><label>Unit</label><select name="unit">'+['Strip','Tablet','Bottle','Piece','Box','Pack','Vial'].map(x=>'<option '+(p.unit===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Purchase cost (₹)</label><input name="cost" type="number" min="0" step=".01" value="'+p.cost+'"></div><div class="field"><label>Selling price (₹)</label><input name="sell" type="number" min="0" step=".01" value="'+p.sell+'"></div><div class="field"><label>GST rate (%)</label><select name="gst">'+[0,5,12,18,28].map(x=>'<option '+(p.gst===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Supplier</label><input name="supplier" value="'+esc(p.supplier)+'"></div><div class="modal-foot wide"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>';openModal();$('#productForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.keys(f).forEach(k=>{if(['qty','cost','sell','gst'].includes(k))f[k]=+f[k]});if(id)Object.assign(p,f);else state.products.push({id:Date.now(),...f});save();closeModal();render()}}
function filterTable(input,table){let q=$('#'+input).value.toLowerCase();$('#'+table).querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function history(){return head('Bill history','Search, review and reprint pharmacy invoices.')+'<section class="panel"><div class="panel-head"><h3>All invoices · '+state.bills.length+'</h3><input class="search" id="histSearch" placeholder="Invoice or customer…" oninput="filterTable(\'histSearch\',\'histTable\')"></div><div class="table-wrap"><table id="histTable"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>'+[...state.bills].reverse().map(b=>'<tr><td><b>'+esc(b.no)+'</b></td><td>'+dateFmt(b.date)+'</td><td>'+esc(b.customer)+'</td><td>'+b.items.length+'</td><td>'+money(b.total)+'</td><td>'+esc(b.payment)+'</td><td><span class="tag">'+esc(b.status)+'</span></td><td><button class="btn secondary small" onclick="showInvoice('+b.id+')">View</button></td></tr>').join('')||'<tr><td colspan="8" class="empty">No invoices have been created.</td></tr>'+'</tbody></table></div></section>'}
function insights(){let month=state.bills.filter(b=>b.date?.slice(0,7)===today().slice(0,7)),revenue=month.reduce((a,b)=>a+b.total,0),cost=month.reduce((a,b)=>a+b.items.reduce((x,c)=>x+(state.products.find(p=>p.id===c.id)?.cost||0)*c.qty,0),0),top={};state.bills.forEach(b=>b.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));let tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);return head('Insights','Understand revenue, product movement and pharmacy performance.')+'<div class="cards">'+metric('Month revenue',money(revenue),'Current calendar month','₹')+metric('Bills this month',month.length,'Invoices created','▤')+metric('Gross margin*',money(revenue-cost),'Estimated using current product cost','↗')+metric('Average bill',money(month.length?revenue/month.length:0),'Average invoice value','◈')+'</div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Sales · last 7 days</h3></div>'+weekChart()+'</section><section class="panel"><div class="panel-head"><h3>Top-selling products</h3></div>'+tops.map(([n,q])=>'<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px"><b>'+esc(n)+'</b><span class="tag">'+q+' units</span></div>').join('')||'<div class="empty">Sales data will appear here.</div>'+'</section></div><div class="notice">*Indicative estimate only. Cost uses the current catalog cost, not historical batch-level cost. Excludes operating expenses and other adjustments.</div>'}
function weekChart(){let ds=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);ds.push({label:d.toLocaleDateString('en-IN',{weekday:'short'}),value:state.bills.filter(b=>b.date===key).reduce((a,b)=>a+b.total,0)})}let max=Math.max(1,...ds.map(x=>x.value));return '<div class="chart">'+ds.map(x=>'<div class="chart-col"><b>'+Math.round(x.value).toLocaleString('en-IN')+'</b><i style="height:'+Math.max(3,x.value/max*115)+'px"></i><small>'+x.label+'</small></div>').join('')+'</div>'}
function purchase(){return head('Purchase management','Record supplier purchases and update stock batches.','<button class="btn primary" onclick="purchaseModal()">＋ Record purchase</button>')+'<div class="cards">'+metric('Purchase entries',state.purchases.length,'Recorded purchase invoices','⇩')+metric('Total purchases',money(state.purchases.reduce((a,p)=>a+p.total,0)),'All-time recorded value','₹')+metric('Suppliers',new Set(state.purchases.map(p=>p.supplier)).size,'Suppliers used','♧')+metric('Pending payments',money(state.purchases.filter(p=>p.status==='Unpaid').reduce((a,p)=>a+p.total,0)),'Marked unpaid','◷')+'</div><section class="panel"><div class="panel-head"><h3>Purchase register</h3></div><div class="table-wrap"><table><thead><tr><th>Purchase no.</th><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead><tbody>'+[...state.purchases].reverse().map(p=>'<tr><td><b>'+esc(p.no)+'</b></td><td>'+dateFmt(p.date)+'</td><td>'+esc(p.supplier)+'</td><td>'+esc(p.product)+'</td><td>'+p.qty+'</td><td>'+money(p.total)+'</td><td><span class="tag '+(p.status==='Unpaid'?'warn':'')+'">'+p.status+'</span></td></tr>').join('')||'<tr><td colspan="7" class="empty">No purchase entries yet.</td></tr>'+'</tbody></table></div></section>'}
function purchaseModal(){let opts=state.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.batch)+'</option>').join('');$('#modal').innerHTML='<h2>Record purchase</h2><form id="purchaseForm" class="form-grid"><div class="field"><label>Product / batch *</label><select name="product" required>'+opts+'</select></div><div class="field"><label>Supplier *</label><input name="supplier" required placeholder="Supplier name"></div><div class="field"><label>Purchase date</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>Quantity *</label><input name="qty" type="number" min="1" required></div><div class="field"><label>Unit cost (₹)</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>Payment status</label><select name="status"><option>Paid</option><option>Unpaid</option></select></div><div class="modal-foot wide"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save purchase</button></div></form>';openModal();$('#purchaseForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),p=state.products.find(x=>x.id===+f.product);f.qty=+f.qty;f.cost=+f.cost;let rec={id:Date.now(),no:'PUR-'+Date.now().toString().slice(-7),date:f.date,supplier:f.supplier,product:p.name,qty:f.qty,cost:f.cost,total:f.qty*f.cost,status:f.status};p.qty+=f.qty;p.cost=f.cost;p.supplier=f.supplier;state.purchases.push(rec);save();closeModal();render()}}
function gst(){let from=$('#gstFrom')?.value||today().slice(0,7)+'-01',to=$('#gstTo')?.value||today(),bills=state.bills.filter(b=>b.date>=from&&b.date<=to),tax=bills.reduce((a,b)=>a+b.tax,0),taxable=bills.reduce((a,b)=>a+b.subtotal,0),rate={};bills.forEach(b=>b.items.forEach(i=>{let k=i.gst;rate[k]=(rate[k]||0)+i.qty*i.price*i.gst/100}));return head('GST report','Tax summary based on recorded invoice line-item rates.')+'<section class="panel"><div class="toolbar" style="margin-bottom:16px"><div class="field"><label>From</label><input class="search" type="date" id="gstFrom" value="'+from+'" onchange="render()"></div><div class="field"><label>To</label><input class="search" type="date" id="gstTo" value="'+to+'" onchange="render()"></div><button class="btn secondary" onclick="exportGST()">Export CSV</button></div><div class="report-grid">'+[['Taxable sales',money(taxable)],['GST collected',money(tax)],['Invoices',bills.length]].map(x=>'<div class="report-box"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel-head" style="margin-top:22px"><h3>Rate-wise summary</h3></div><div class="table-wrap"><table><thead><tr><th>GST rate</th><th>Tax amount</th></tr></thead><tbody>'+Object.keys(rate).sort((a,b)=>a-b).map(k=>'<tr><td>'+k+'%</td><td>'+money(rate[k])+'</td></tr>').join('')||'<tr><td colspan="2" class="empty">No GST data for this period.</td></tr>'+'</tbody></table></div><div class="notice">This is an operational summary, not a GST return or filing. Confirm HSN classification, exemptions, place-of-supply rules, invoice requirements and return treatment with your tax professional before filing.</div></section>'}
function sales(){let from=$('#salesFrom')?.value||today().slice(0,7)+'-01',to=$('#salesTo')?.value||today(),bills=state.bills.filter(b=>b.date>=from&&b.date<=to),total=bills.reduce((a,b)=>a+b.total,0),modes={};bills.forEach(b=>modes[b.payment]=(modes[b.payment]||0)+b.total);return head('Sales report','Review sales totals and payment mix for any date range.')+'<section class="panel"><div class="toolbar" style="margin-bottom:16px"><div class="field"><label>From</label><input class="search" type="date" id="salesFrom" value="'+from+'" onchange="render()"></div><div class="field"><label>To</label><input class="search" type="date" id="salesTo" value="'+to+'" onchange="render()"></div><button class="btn secondary" onclick="exportSales()">Export CSV</button></div><div class="report-grid">'+[['Gross sales',money(total)],['Invoices',bills.length],['Average invoice',money(bills.length?total/bills.length:0)]].map(x=>'<div class="report-box"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="grid2" style="margin-top:18px"><div><h3 style="font:700 14px Manrope">Payment mix</h3>'+Object.entries(modes).map(([k,v])=>'<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><b>'+esc(k)+'</b><span>'+money(v)+'</span></div><div class="bar"><i style="width:'+(v/Math.max(1,total)*100)+'%"></i></div></div>').join('')||'<div class="empty">No sales yet.</div>'+'</div><div><h3 style="font:700 14px Manrope">Invoice register</h3><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Total</th></tr></thead><tbody>'+bills.map(b=>'<tr><td>'+esc(b.no)+'</td><td>'+dateFmt(b.date)+'</td><td>'+money(b.total)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No invoices</td></tr>'+'</tbody></table></div></div></div></section>'}
function settings(){let s=state.settings;return head('Settings','Configure pharmacy identity, invoice details and UPI.')+'<section class="panel"><form id="settingsForm" class="form-grid"><div class="field"><label>Pharmacy / store name</label><input name="store" value="'+esc(s.store)+'" required></div><div class="field"><label>Phone</label><input name="phone" value="'+esc(s.phone)+'"></div><div class="field wide"><label>Store address</label><textarea name="address" rows="2">'+esc(s.address)+'</textarea></div><div class="field"><label>GSTIN</label><input name="gstin" value="'+esc(s.gstin)+'" placeholder="15-character GSTIN"></div><div class="field"><label>UPI ID (VPA)</label><input name="upi" value="'+esc(s.upi)+'" placeholder="yourname@upi"></div><div class="field"><label>Default GST rate (%)</label><select name="gstDefault">'+[0,5,12,18,28].map(x=>'<option '+(s.gstDefault==x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="modal-foot wide"><button class="btn primary">Save settings</button></div></form></section><section class="panel"><h3 style="font:700 15px Manrope">Data management</h3><p class="muted" style="font-size:12px">Your current workspace saves data in this browser on this device. Export regular backups. Browser storage is not shared automatically between devices.</p><div class="toolbar"><button class="btn secondary" onclick="backup()">Download backup JSON</button><label class="btn secondary">Restore backup<input type="file" accept=".json,application/json" hidden onchange="restore(event)"></label><button class="btn secondary" onclick="exportCSV()">Export product catalog</button></div><div class="notice" style="margin-top:15px">For a real multi-user pharmacy deployment, connect a secure hosted database, user authentication, encrypted backups, audit trails and payment gateway reconciliation. This browser-only build is a functional prototype and should not yet be used as the sole statutory accounting or dispensing record.</div></section>'}
function render(){let fn={dashboard,billing,inventory,history,insights,purchase,gst,sales,settings}[page];$('#view').innerHTML=fn();if(page==='billing')renderQR()}
function openModal(){$('#modalOverlay').classList.add('show')}function closeModal(){$('#modalOverlay').classList.remove('show')}$('#modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')closeModal()}
function download(name,content,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}
function exportCSV(){download('medibill-products-'+today()+'.csv',csv([['Name','SKU','Batch','Expiry','Quantity','Unit','Cost','Selling price','GST','Supplier'],...state.products.map(p=>[p.name,p.sku,p.batch,p.expiry,p.qty,p.unit,p.cost,p.sell,p.gst,p.supplier])]),'text/csv')}
function exportSales(){let from=$('#salesFrom').value,to=$('#salesTo').value,b=state.bills.filter(x=>x.date>=from&&x.date<=to);download('medibill-sales-'+from+'-'+to+'.csv',csv([['Invoice','Date','Customer','Subtotal','GST','Discount','Total','Payment'],...b.map(x=>[x.no,x.date,x.customer,x.subtotal,x.tax,x.discount,x.total,x.payment])]),'text/csv')}
function exportGST(){let from=$('#gstFrom').value,to=$('#gstTo').value,b=state.bills.filter(x=>x.date>=from&&x.date<=to);download('medibill-gst-'+from+'-'+to+'.csv',csv([['Invoice','Date','Customer','Taxable subtotal','GST','Total'],...b.map(x=>[x.no,x.date,x.customer,x.subtotal,x.tax,x.total])]),'text/csv')}
function backup(){download('medibill-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.bills)throw Error();state=d;save();render();alert('Backup restored.')}catch(err){alert('This file is not a valid MediBill backup.')}};r.readAsText(f)}
$('#settingsForm')?.addEventListener('submit',()=>{});
function initSettings(){document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.gstDefault=+f.gstDefault;state.settings=f;save();alert('Settings saved.');render()}})}
initSettings();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});nav();render();
</script></body></html>
