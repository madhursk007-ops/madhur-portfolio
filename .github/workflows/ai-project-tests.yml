name: AI project tests

on:
  push:
    branches: [main, ai-engineering-projects-2026]
    paths:
      - "projects/industrial-diagnostics-assistant/**"
      - "projects/technical-knowledge-assistant/**"
      - "projects/vehicle-value-intelligence/**"
      - ".github/workflows/ai-project-tests.yml"
  pull_request:
    paths:
      - "projects/industrial-diagnostics-assistant/**"
      - "projects/technical-knowledge-assistant/**"
      - "projects/vehicle-value-intelligence/**"
      - ".github/workflows/ai-project-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/industrial-diagnostics-assistant
          - projects/technical-knowledge-assistant
          - projects/vehicle-value-intelligence
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -q
