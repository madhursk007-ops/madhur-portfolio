name: Build MediBill for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - "public/projects/medibill/**"
      - ".github/workflows/medibill-windows.yml"
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: public/projects/medibill
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/projects/medibill/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MediBill-Windows-Installer
          path: public/projects/medibill/release/*.exe
          if-no-files-found: error
          retention-days: 30
